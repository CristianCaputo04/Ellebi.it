<div class="cookie" id="cookie-banner" role="dialog" aria-modal="false" aria-labelledby="cookie-title" aria-describedby="cookie-text" hidden>
  <h2 class="cookie__title" id="cookie-title">Cookie e privacy</h2>
  <p class="cookie__text" id="cookie-text">Questo sito usa solo cookie tecnici necessari al funzionamento. Le statistiche anonime sono facoltative e restano spente finché non dai il consenso: rifiutare costa un clic quanto accettare, e puoi cambiare idea in ogni momento. <a class="link-line" href="/cookie">Cookie policy</a></p>

  <div class="cookie__options">
    <label class="cookie__option">
      <input type="checkbox" checked disabled>
      <span><strong>Necessari</strong> — indispensabili per la visualizzazione del sito. Sempre attivi.</span>
    </label>
    <label class="cookie__option">
      <input type="checkbox" id="consent-analytics">
      <span><strong>Statistiche anonime</strong> — conteggio delle visite senza cookie di profilazione e senza dati personali.</span>
    </label>
  </div>

  <div class="cookie__actions">
    <button class="btn btn--solid" type="button" data-cookie-accept>Accetta tutto</button>
    <button class="btn" type="button" data-cookie-reject>Rifiuta tutto</button>
    <button class="btn" type="button" data-cookie-save>Salva scelte</button>
  </div>
</div>
