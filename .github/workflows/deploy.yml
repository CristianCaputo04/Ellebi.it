name: Pubblica su Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produzione
  cancel-in-progress: true

jobs:
  deploy:
    name: Pubblica il sito
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Sta prima di tutto il resto perché è il controllo più economico e
      # quello che intercetta gli errori peggiori: un file JavaScript che non
      # compila, una chiave segreta finita in wrangler.toml, una rotta
      # generata che manca da run_worker_first. Pubblicare uno di questi
      # significa accorgersene dal sito in produzione.
      - name: Verifica la coerenza del progetto
        run: node tools/verifica.mjs

      - name: Controlla le marche di versione di CSS e JS
        run: python3 tools/aggiorna-versioni.py --check

      - name: Controlla che la sitemap elenchi tutte le pagine
        run: python3 tools/aggiorna-sitemap.py --check

      - name: Controlla la configurazione
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Pubblica su Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Lo stesso sito, pubblicato anche su Cloudflare Pages per avere un
  # indirizzo con il solo nome del marchio: emmelu.pages.dev (quello del
  # Worker contiene il nome dell'account). Lavoro separato apposta: se Pages
  # non va, il sito sul Worker si pubblica comunque.
  pages:
    name: Pubblica su emmelu.pages.dev
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepara file e configurazione per Pages
        run: node tools/prepara-pages.mjs

      # La prima volta crea il progetto; le volte dopo dice che esiste gia',
      # e non e' un errore.
      - name: Crea il progetto Pages se manca
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create emmelu --production-branch main || echo "Progetto gia' esistente, proseguo."

      - name: Pubblica
        working-directory: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy --branch main --commit-dirty=true
