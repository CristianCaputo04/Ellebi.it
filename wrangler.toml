# Configurazione Cloudflare Workers — sito vetrina ELLEBI.
#
# Il sito non ha codice lato server: Cloudflare pubblica direttamente i file
# della cartella "public" (funzione Workers Static Assets). Tutto ciò che sta
# fuori da "public" — README, script di servizio, cronologia Git — resta
# privato e non finisce online.
#
# I file public/_headers e public/_redirects vengono letti in automatico.

name = "ellebi-it"
compatibility_date = "2026-08-11"

[assets]
directory = "./public"

# Un indirizzo inesistente mostra la pagina 404 del sito
not_found_handling = "404-page"

# /privacy pubblica privacy.html senza mostrare l'estensione
html_handling = "auto-trailing-slash"

[observability]
enabled = true
