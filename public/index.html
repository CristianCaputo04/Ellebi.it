<!-- Pagina "in arrivo": nessuno script e nessun cookie, solo HTML e CSS. -->
<style>
  :root {
    --c-espresso: #3f2418;
    --c-muted: #6f5346;
    --c-blush: #f6ddd0;
    --c-blush-soft: #fbeae1;
    --c-paper: #fbf7f4;
    --c-terracotta: #c2836a;
    --c-terracotta-ink: #9c5539;
    --c-line: rgba(63, 36, 24, 0.16);
    --c-focus: #8a4a2c;
    --f-sans: "Jost", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --f-serif: "Cormorant Garamond", Iowan Old Style, Georgia, "Times New Roman", serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: var(--f-sans);
    font-weight: 300;
    font-size: clamp(0.94rem, 0.9rem + 0.24vw, 1.06rem);
    line-height: 1.65;
    color: var(--c-espresso);
    background:
      radial-gradient(ellipse 70% 55% at 50% 0%, var(--c-blush) 0%, transparent 70%),
      radial-gradient(ellipse 60% 45% at 100% 100%, var(--c-blush-soft) 0%, transparent 70%),
      var(--c-paper);
    -webkit-font-smoothing: antialiased;
  }

  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: clamp(2.5rem, 6vh, 5rem) clamp(1rem, 0.6rem + 2.6vw, 4rem);
  }

  .soon {
    width: 100%;
    max-width: 38rem;
    text-align: center;
    animation: rise 1.2s cubic-bezier(.2, .7, .2, 1) both;
  }

  .soon__logo {
    display: block;
    width: clamp(7.5rem, 5rem + 12vw, 11rem);
    height: auto;
    margin: 0 auto clamp(1.75rem, 4vh, 2.75rem);
    border-radius: 50%;
    box-shadow: 0 1.5rem 3rem -1.5rem rgba(63, 36, 24, 0.35);
  }

  .soon__eyebrow {
    margin: 0 0 1rem;
    font-size: clamp(0.66rem, 0.62rem + 0.16vw, 0.74rem);
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--c-terracotta-ink);
  }

  .soon__title {
    margin: 0;
    font-family: var(--f-serif);
    font-weight: 300;
    font-size: clamp(2.3rem, 1.3rem + 4.6vw, 4.6rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }

  .soon__title em { font-style: italic; color: var(--c-terracotta-ink); }

  /* Filo che si "cuce" da sinistra a destra, all'infinito */
  .stitch {
    position: relative;
    width: min(15rem, 70%);
    height: 2px;
    margin: clamp(1.75rem, 4vh, 2.5rem) auto;
    background-image: linear-gradient(to right, var(--c-line) 55%, transparent 0);
    background-size: 12px 2px;
    overflow: hidden;
  }

  .stitch::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(to right, var(--c-terracotta) 55%, transparent 0);
    background-size: 12px 2px;
    transform-origin: left;
    animation: sew 3.6s ease-in-out infinite;
  }

  .soon__text {
    margin: 0 auto;
    max-width: 30rem;
    font-size: clamp(1.02rem, 0.96rem + 0.4vw, 1.2rem);
    color: var(--c-muted);
  }

  .soon__actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.75rem;
    margin-top: clamp(2rem, 5vh, 3rem);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 3rem;
    padding: 0.8rem 1.6rem;
    border: 1px solid var(--c-espresso);
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--c-espresso);
    transition: background-color .3s, color .3s, transform .3s;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn--solid { background: var(--c-espresso); color: var(--c-paper); }
  .btn--solid:hover { background: var(--c-terracotta-ink); border-color: var(--c-terracotta-ink); }
  .btn:not(.btn--solid):hover { background: var(--c-espresso); color: var(--c-paper); }

  a:focus-visible {
    outline: 2px solid var(--c-focus);
    outline-offset: 3px;
  }

  .soon__mail {
    margin: 1.75rem 0 0;
    font-size: 0.9rem;
    color: var(--c-muted);
  }

  .soon__mail a {
    color: var(--c-espresso);
    text-decoration-color: var(--c-terracotta);
    text-underline-offset: 0.2em;
  }

  footer {
    padding: 1.25rem 1rem calc(1.25rem + env(safe-area-inset-bottom));
    text-align: center;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    color: var(--c-muted);
  }

  footer a { color: inherit; text-underline-offset: 0.2em; }
  footer span { margin: 0 0.5em; opacity: 0.5; }

  @keyframes sew {
    0%   { transform: scaleX(0); }
    50%  { transform: scaleX(1); }
    100% { transform: scaleX(1); opacity: 0; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(1.25rem); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .soon, .stitch::after { animation: none; }
    .stitch::after { transform: scaleX(0.6); }
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
</head>

<body>
<main>
  <div class="soon">
    <img class="soon__logo" src="/assets/img/logo-ellebi.svg" alt="ELLEBI" width="176" height="176">

    <p class="soon__eyebrow">Coming soon</p>
    <h1 class="soon__title">Il nuovo sito<br>è <em>in lavorazione</em></h1>

    <div class="stitch" aria-hidden="true"></div>

    <p class="soon__text">Come le nostre borse, anche il sito lo stiamo creando a mano, un punto alla volta. Torna a trovarci presto: manca poco.</p>

    <div class="soon__actions">
      <a class="btn btn--solid" href="https://www.instagram.com/ellebi.it/" rel="noopener">Seguici su Instagram</a>
      <a class="btn" href="https://www.vinted.it/member/65695128-pinkstraw7" rel="noopener">Pezzi disponibili</a>
    </div>

    <p class="soon__mail">Per informazioni: <a href="mailto:ellebi.style@gmail.com">ellebi.style@gmail.com</a></p>
  </div>
</main>

<footer>
  © 2026 ELLEBI — Borse fatte a mano
  <span>·</span><a href="/privacy">Privacy</a>
  <span>·</span><a href="/cookie">Cookie</a>
</footer>
</body>
</html>
